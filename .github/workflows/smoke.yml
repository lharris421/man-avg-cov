# Two builds of the whole manuscript pipeline on a clean Ubuntu runner:
#   smoke: small BRCA1 dataset, ten iterations, everything regenerated. Checks
#          the repository is self-contained; does not reproduce the paper.
#   fetch: results and BRCA1 data downloaded from Zenodo, nothing regenerated.
#          Checks the downloads (against Zenodo's checksums) and that the paper
#          builds from the published results. The data file is only downloaded.
#
# The first run installs ~150 R packages, mostly from source, and can take
# 30-40 minutes. setup-renv caches the library keyed on renv.lock, so later
# runs skip the install unless the lockfile changes.
#
# The built PDF and figures are kept as a downloadable workflow artifact
# ("smoke-outputs" on the run page) and summarised on the run's summary tab.
#
# Publishing to GitHub Pages is commented out below. The Actions token cannot
# create the Pages site itself ("Resource not accessible by integration"), so
# to turn it back on: Settings -> Pages -> Source: "GitHub Actions" (once),
# then uncomment the "Upload the proof page" step and the publish job.

name: smoke-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: smoke
            config: smoke=true iterations=10
          - build: fetch
            config: fetch_results=true fetch_brca1=true
    env:
      # Lets renv fetch the GitHub-sourced packages (hdrm, hdi fork) without
      # hitting the anonymous rate limit.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: System libraries needed to build the R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmpfr-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev \
            libpng-dev libtiff5-dev libjpeg-dev

      - name: TeX Live (latexmk, lualatex, texfot, and the packages the manuscript uses)
        run: |
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-science texlive-pictures texlive-bibtex-extra \
            texlive-fonts-recommended texlive-extra-utils \
            qpdf poppler-utils
          which latexmk lualatex texfot

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'       # read the R version from renv.lock
          use-public-rspm: true   # binary packages where available; renv honours this

      - name: Restore the R library from renv.lock (cached on the lockfile hash)
        uses: r-lib/actions/setup-renv@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snakemake
        run: pip install 'snakemake==9.*'

      - name: Build everything (${{ matrix.config }})
        run: snakemake --cores 4 --config ${{ matrix.config }}

      # The BRCA1 record lists the data file and its three results; the latter
      # come out of the results zip, so this checks both downloads.
      - name: Check the Zenodo downloads against the record's checksums
        if: matrix.build == 'fetch'
        run: |
          curl -fsSL https://zenodo.org/api/records/23894239 \
            | jq -r '.files[] | "\(.checksum | ltrimstr("md5:"))  \(.key)"' \
            | sed -E 's#  (brca1_)#  code/rds/5/\1#; s#  brca1\.rds$#  data/brca1.rds#' \
            | md5sum -c -

      - name: Assemble the proof page (PDF, figures, build provenance)
        env:
          BUILD: ${{ matrix.build }}
          BUILD_CONFIG: ${{ matrix.config }}
        run: |
          .github/scripts/make-site.sh site
          cat site/summary.md >> "$GITHUB_STEP_SUMMARY"

      # - name: Upload the proof page for publishing
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: site

      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build }}-outputs
          path: |
            build/avg-cov.pdf
            code/out/
          if-no-files-found: warn

  # Publishing is disabled; see the note at the top of this file.
