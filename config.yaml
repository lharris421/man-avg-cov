iterations: 1000
alpha: 5
seed: 1234
desparsified: true

# Smoke test: run the data analysis (figure 1) on data/brca1_small.rds instead
# of data/brca1.rds.
smoke: false

# Quiet mode: only the simulation progress bars print (R messages and warnings
# are silenced; errors are not). Snakemake's own -q flag turns this on as well.
quiet: true

# Results under code/rds are protected: the rules that produce them are not
# defined, so snakemake never regenerates or deletes them. Set false to let
# snakemake rebuild missing or outdated results. Smoke runs ignore this and
# always regenerate their own small results.
protect_results: true
